<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" role="img" aria-labelledby="t">
  <title id="t">The driver's door open. A sticker on the door frame, below the latch, is enlarged; its bottom line, marked VIN, is highlighted in yellow.</title>
  <!-- Drawn for Vinzuu. -->
  <defs>
    <linearGradient id="cabin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B3238"/><stop offset="1" stop-color="#14181B"/>
    </linearGradient>
    <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9CED2"/><stop offset="0.55" stop-color="#E4E7EA"/><stop offset="1" stop-color="#B9BFC4"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4F5F6"/><stop offset="1" stop-color="#D6DADD"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#FFFFFF" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- inside of the car -->
  <rect width="1024" height="576" fill="url(#cabin)"/>
  <!-- driver's seat -->
  <path d="M150 40 Q250 20 330 60 L360 330 Q300 360 190 350 Z" fill="#23292E" stroke="#3A4248" stroke-width="3"/>
  <path d="M200 70 Q260 58 310 84 L330 300 Q270 318 215 312 Z" fill="#2C3338"/>
  <path d="M70 360 Q240 320 520 352 Q560 420 520 470 Q300 500 80 470 Q40 420 70 360 Z" fill="#23292E" stroke="#3A4248" stroke-width="3"/>
  <path d="M110 380 Q260 352 480 376 Q500 420 478 450 Q300 470 120 452 Z" fill="#2C3338"/>
  <!-- steering wheel edge -->
  <path d="M0 40 Q120 60 130 200 Q120 300 0 330" fill="none" stroke="#0E1113" stroke-width="34"/>
  <!-- floor sill -->
  <rect x="0" y="500" width="760" height="76" fill="#0F1214"/>

  <!-- door frame (B-pillar edge the door closes against) -->
  <path d="M700 0 L800 0 L808 576 L716 576 Z" fill="url(#pillar)"/>
  <path d="M700 0 L716 576" stroke="#9AA1A7" stroke-width="3"/>
  <!-- door latch striker -->
  <rect x="736" y="268" width="34" height="24" rx="6" fill="#8D959B"/>
  <circle cx="753" cy="280" r="7" fill="#5E666C"/>
  <!-- the sticker on the frame, below the latch -->
  <rect x="728" y="356" width="56" height="78" rx="4" fill="#FFFFFF" stroke="#F5B700" stroke-width="4"/>
  <g stroke="#6B747B" stroke-width="2"><line x1="736" y1="372" x2="776" y2="372"/><line x1="736" y1="386" x2="776" y2="386"/><line x1="736" y1="400" x2="776" y2="400"/><line x1="736" y1="420" x2="776" y2="420"/></g>

  <!-- the open door, swung out to the right -->
  <path d="M812 0 L1024 0 L1024 576 L824 576 Q860 300 812 0 Z" fill="url(#door)"/>
  <path d="M812 0 Q860 300 824 576" fill="none" stroke="#A8AFB4" stroke-width="4"/>
  <rect x="900" y="90" width="110" height="16" rx="8" fill="#B5BBC0"/>

  <!-- arrow pointing at the sticker -->
  <path d="M890 420 L812 398 L826 372 L760 392 L806 440 L816 418 Z" fill="#1E6FD9" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>

  <!-- leader line to the enlarged sticker -->
  <line x1="728" y1="400" x2="690" y2="400" stroke="#FFFFFF" stroke-width="3"/>

  <!-- enlarged sticker -->
  <g filter="url(#glow)">
    <rect x="300" y="300" width="390" height="190" rx="8" fill="#FFFFFF" stroke="#20262B" stroke-width="3"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#20262B">
    <text x="495" y="326" font-size="15" font-weight="700" text-anchor="middle">MANUFACTURER'S LABEL</text>
    <text x="316" y="352" font-size="11" font-weight="700">GVWR</text>
    <text x="316" y="366" font-size="11">XXXX KG</text>
    <text x="420" y="352" font-size="11" font-weight="700">TIRES</text>
    <text x="420" y="366" font-size="11">XXX/XXRXX</text>
    <text x="530" y="352" font-size="11" font-weight="700">RIM</text>
    <text x="530" y="366" font-size="11">XXxX.XJ</text>
    <text x="606" y="352" font-size="11" font-weight="700">COLD TIRE</text>
    <text x="606" y="366" font-size="11">XXX kPa</text>
    <text x="316" y="392" font-size="11" font-weight="700">GAWR FRONT</text>
    <text x="316" y="406" font-size="11">XXXX KG</text>
    <text x="420" y="392" font-size="11" font-weight="700">GAWR REAR</text>
    <text x="420" y="406" font-size="11">XXXX KG</text>
    <text x="530" y="392" font-size="11" font-weight="700">MFD</text>
    <text x="530" y="406" font-size="11">MM/YY</text>
    <text x="316" y="430" font-size="9.5" fill="#6B747B">THIS VEHICLE CONFORMS TO ALL APPLICABLE SAFETY STANDARDS</text>
    <text x="316" y="442" font-size="9.5" fill="#6B747B">IN EFFECT ON THE DATE OF MANUFACTURE SHOWN ABOVE.</text>
    <rect x="312" y="452" width="366" height="28" rx="3" fill="#F5D90A"/>
    <text x="320" y="472" font-family="'Courier New', monospace" font-size="18" font-weight="700">VIN: XXXXXXXXXXXXXXXXX</text>
  </g>
</svg>
