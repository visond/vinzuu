<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" role="img" aria-labelledby="t">
  <title id="t">Open driver's door: the VIN sticker is on the door frame, at the edge the door closes against</title>
  <rect width="460" height="320" fill="#E8EEF2"/>
  <!-- car body, side view, with the driver's door opening -->
  <path d="M40 250 L40 150 Q48 112 96 104 L190 96 Q232 52 300 52 L372 56 Q410 60 430 110 L436 250 Z" fill="#9CC9DE"/>
  <path d="M206 100 Q240 66 298 66 L360 70 Q392 74 408 112 Z" fill="#2E4756"/>
  <!-- door opening (dark interior) -->
  <path d="M214 112 L404 116 L410 240 L214 240 Z" fill="#33434D"/>
  <path d="M232 128 L300 128 L300 236 L232 236 Z" fill="#46565F"/>
  <!-- B-pillar / door frame where the sticker is -->
  <rect x="196" y="104" width="20" height="140" rx="3" fill="#B7DAEA"/>
  <rect x="200" y="176" width="13" height="22" rx="1.5" fill="#FFFFFF" stroke="#10283B" stroke-width="1"/>
  <g stroke="#10283B" stroke-width="1"><line x1="202" y1="181" x2="211" y2="181"/><line x1="202" y1="185" x2="211" y2="185"/><line x1="202" y1="190" x2="211" y2="190"/></g>
  <!-- the open door, swung out towards the viewer -->
  <path d="M216 104 L330 40 L338 248 L216 244 Z" fill="#B3D8E8" stroke="#7FB2C9" stroke-width="2"/>
  <path d="M232 104 L320 56 L322 130 L232 150 Z" fill="#5C7380" opacity="0.85"/>
  <rect x="300" y="160" width="20" height="6" rx="3" fill="#7FB2C9"/>
  <!-- wheels -->
  <circle cx="110" cy="252" r="34" fill="#1E2A31"/><circle cx="110" cy="252" r="14" fill="#9AA7AE"/>
  <circle cx="392" cy="252" r="30" fill="#1E2A31" opacity="0.6"/>
  <!-- magnifier -->
  <line x1="206" y1="198" x2="150" y2="230" stroke="#F5B700" stroke-width="3"/>
  <circle cx="206" cy="187" r="16" fill="none" stroke="#F5B700" stroke-width="3"/>
  <g>
    <rect x="12" y="214" width="250" height="94" rx="12" fill="#FFFFFF" stroke="#F5B700" stroke-width="3"/>
    <text x="26" y="236" font-family="Arial, sans-serif" font-size="11" fill="#6B7A84">TIRES 205/55R16   RIM 16X6.5J</text>
    <text x="26" y="252" font-family="Arial, sans-serif" font-size="11" fill="#6B7A84">MFD BY TOYOTA MOTOR CORPORATION</text>
    <text x="26" y="284" font-family="'Courier New', monospace" font-size="18" font-weight="700" fill="#10283B">VIN:JTMBK31V996054321</text>
    <rect x="26" y="290" width="40" height="3" fill="#F5B700"/>
  </g>
</svg>
