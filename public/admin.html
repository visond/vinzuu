<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin | Vinzuu</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%2310283B%27/%3E%3Cg transform=%27translate(3.5,11.5) scale(0.4)%27%3E%3Cpath d=%27M3 18 Q3 10 13 9 L19 9 Q23 3 33 3 L41 9 L53 9 Q59 9 59 15 L59 18 Z%27 fill=%27%23fff%27/%3E%3Ccircle cx=%2715%27 cy=%2719%27 r=%274%27 fill=%27%230A1420%27/%3E%3Ccircle cx=%2747%27 cy=%2719%27 r=%274%27 fill=%27%230A1420%27/%3E%3Crect x=%2757%27 y=%2712%27 width=%273%27 height=%273%27 rx=%271%27 fill=%27%23F5B700%27/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="admin-page">
  <div id="demo-banner" class="demo-banner" hidden>
    Demo data is loaded. Demo admin: <b>admin@vinzuu.rw</b>, password <b>Admin-vinzuu1</b>. To start clean: stop the server, run "npm run reset-db", then start with "npm run start:real".
  </div>

  <header class="site-header wrap-wide">
    <a class="brand" href="/"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#10283B" stroke="#F5B700" stroke-width="2"/><g transform="translate(3.5,11.5) scale(0.4)"><path d="M3 18 Q3 10 13 9 L19 9 Q23 3 33 3 L41 9 L53 9 Q59 9 59 15 L59 18 Z" fill="#fff"/><circle cx="15" cy="19" r="4" fill="#0A1420"/><circle cx="47" cy="19" r="4" fill="#0A1420"/><rect x="57" y="12" width="3" height="3" rx="1" fill="#F5B700"/></g></svg>Vinzuu</a>
    <div class="biz-header-right"><span id="admin-account"></span></div>
  </header>

  <main class="wrap-wide">
    <section id="login" class="wrap" aria-labelledby="login-title">
      <h1 id="login-title">Admin sign in</h1>
      <form id="login-form" class="panel" novalidate>
        <div class="field">
          <label for="ad-email">Admin email</label>
          <input id="ad-email" type="email" autocomplete="email">
        </div>
        <div class="field">
          <label for="ad-password">Password</label>
          <input id="ad-password" type="password" autocomplete="current-password">
        </div>
        <button class="btn btn-primary" type="submit">Sign in</button>
        <p id="login-status" class="status" role="status" aria-live="polite"></p>
        <p class="small muted">Only admin accounts can open this page. Admins are the only ones who can post parts.</p>
      </form>
    </section>

    <section id="console" hidden>
      <div class="console-head">
        <h1>Admin</h1>
        <span class="admin-head-right"><button id="sign-out" class="btn btn-secondary btn-small" type="button">Sign out</button></span>
      </div>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div id="panel" role="tabpanel"></div>
    </section>
  </main>

  <script src="/common.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
